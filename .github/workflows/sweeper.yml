name: sweeper
on:
  schedule:
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC, after the 03:00 integration sweep
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
permissions:
  id-token: write
  contents: read
jobs:
  aws:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUD_NUKE_VERSION: v0.53.0
      CLOUD_NUKE_SHA256: 7e47ec383855eb3e0111335d9c73a7f09b942e4f78fcf3c3e297cf375272dbf0  # cloud-nuke_linux_amd64 from the release SHA256SUMS
      DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_ROLE_ARN }}", aws-region: "${{ secrets.AWS_REGION }}" }
      - name: Refuse to run outside the test account
        env: { EXPECTED_ACCOUNT: "${{ vars.SWEEPER_AWS_ACCOUNT_ID }}" }
        run: |
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ -n "$EXPECTED_ACCOUNT" ] && [ "$acct" = "$EXPECTED_ACCOUNT" ] || { echo "account $acct is not the test account"; exit 1; }
      - name: Install cloud-nuke
        run: |  # pinned version, checksum verified
          curl -sSL -o cloud-nuke "https://github.com/gruntwork-io/cloud-nuke/releases/download/${CLOUD_NUKE_VERSION}/cloud-nuke_linux_amd64"
          echo "${CLOUD_NUKE_SHA256}  cloud-nuke" | sha256sum -c -
          sudo install -m 0755 cloud-nuke /usr/local/bin/cloud-nuke
      - name: Sweep
        env:
          DRY: "${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}"
          AWS_REGION_NAME: "${{ secrets.AWS_REGION }}"
        run: |
          regions=(--region "$AWS_REGION_NAME" --region global)
          [ "$AWS_REGION_NAME" = us-east-1 ] || regions+=(--region us-east-1)
          flags=("${regions[@]}" --config scripts/sweeper/aws-cloud-nuke.yaml --older-than 6h --force)
          if [ "$DRY" = "true" ]; then cloud-nuke aws "${flags[@]}" --dry-run; else cloud-nuke aws "${flags[@]}"; fi
  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}", service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Sweep
        env:
          PROJECT: "${{ vars.SWEEPER_GCP_PROJECT_ID }}"
          DRY: "${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}"
          GCP_SERVICE_ACCOUNT: "${{ secrets.GCP_SERVICE_ACCOUNT }}"
        run: bash scripts/sweeper/gcp-sweep.sh "$PROJECT" "$DRY"
