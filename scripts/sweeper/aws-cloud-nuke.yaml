# cloud-nuke configuration for the weekly sweeper (.github/workflows/sweeper.yml).
#
# ALLOWLIST: a resource is deleted only if it carries the tag Environment=test (the value is
# matched case-insensitively against ^test$). Every module example sets context
# environment = "test", so every taggable resource it creates gets that tag through
# terraform-null-naming. Anything without the tag is left alone, whatever its name: the
# sandbox account behind SWEEPER_AWS_ACCOUNT_ID also hosts the olensys.com dev environment
# (os-dev-*, /os/dev/*, os-shared-network) and the long-lived integration fixtures
# (Environment=shared, olensys-shared-*), and the 2026-11-01 sweep showed that an
# exclude-only config cannot be kept complete by hand.
#
# How cloud-nuke v0.53.0 evaluates this (config/config.go, ResourceType.ShouldInclude):
#   - include.tags: the tag key must exist and its lowercased value must match. A resource
#     without the key is skipped. A resource type whose lister does not report tags passes
#     nil and is skipped "for safety", so such types are never swept by this config and
#     leaks of those types must be removed by hand.
#   - exclude.* is evaluated before include.* and still wins, so the second guard below
#     stays: Environment=shared, names ^olensys-shared-, the CI role github-integration,
#     OrganizationAccountAccessRole, AWSBudgetsActionsRole*, AWSServiceRole*, the GitHub
#     OIDC provider and the state bucket olensys-tf-test-state.
#   - include.names_regex is ANDed with include.tags, so it is deliberately not used here:
#     most identifiers are ids (vpc-…, subnet-…), not names.
#   - --older-than 6h on the command line keeps resources younger than 6h out of the sweep.
# Keep this file and docs/runbooks/test-accounts.md section A.2 in agreement.
VPC:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
ECSCluster:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
ACM:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
S3:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
      - '^olensys-tf-test-state'
    tags:
      Environment: '^shared$'
CloudFrontDistribution:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
IAMRoles:
  include:
    tags:
      Environment: '^test$'
  exclude:
    names_regex:
      - '^olensys-shared-'
      - '^github-integration$'
      - '^OrganizationAccountAccessRole$'
      - '^AWSBudgetsActionsRole'
      - '^AWSServiceRole'
    tags:
      Environment: '^shared$'
