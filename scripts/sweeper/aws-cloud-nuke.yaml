# cloud-nuke configuration for the weekly sweeper (.github/workflows/sweeper.yml).
#
# The AWS account behind SWEEPER_AWS_ACCOUNT_ID is dedicated to integration tests, so
# anything older than --older-than is swept EXCEPT the long-lived infrastructure the
# integration tests depend on. Kept, and why:
#   - Everything tagged Environment=shared (exact key casing; the value is matched
#     case-insensitively against ^shared$). The shared VPC, ECS cluster and ACM
#     certificate are created with context environment = "shared", which yields that
#     tag and names starting olensys-shared-. Applied to every resource type below.
#   - Names matching ^olensys-shared- for VPC, ECSCluster, ACM, S3, CloudFront and IAM.
#   - IAM roles: github-integration (the CI OIDC role),
#     OrganizationAccountAccessRole (the owner's admin path into the account),
#     AWSReservedSSO_* (IAM Identity Center permission-set roles),
#     AWSBudgetsActionsRole* (the budget hard-stop) and AWSServiceRole* (service-linked).
#   - The GitHub OIDC identity provider (token.actions.githubusercontent.com).
#   - The Terraform state bucket olensys-tf-test-state (S3).
# Test resources carry environment = "test" / the olensys-test- prefix and are swept.
# Filter syntax verified against cloud-nuke v0.53.0 config/config.go (exclude.names_regex,
# exclude.tags). Types that do not expose tags simply ignore the tag filter.
VPC:
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
ECSCluster:
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
ACM:
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
S3:
  exclude:
    names_regex:
      - '^olensys-shared-'
      - '^olensys-tf-test-state'
    tags:
      Environment: '^shared$'
CloudFrontDistribution:
  exclude:
    names_regex:
      - '^olensys-shared-'
    tags:
      Environment: '^shared$'
IAMRoles:
  exclude:
    names_regex:
      - '^olensys-shared-'
      - '^github-integration$'
      - '^OrganizationAccountAccessRole$'
      - '^AWSBudgetsActionsRole'
      - '^AWSReservedSSO_'
      - '^AWSServiceRole'
    tags:
      Environment: '^shared$'
IAMServiceLinkedRoles:
  exclude:
    names_regex:
      - '^AWSServiceRole'
OIDCProvider:
  exclude:
    names_regex:
      - 'token\.actions\.githubusercontent\.com'
ACMPCA:
  exclude:
    tags:
      Environment: '^shared$'
AMI:
  exclude:
    tags:
      Environment: '^shared$'
